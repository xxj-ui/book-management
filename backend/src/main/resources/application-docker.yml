# ============================================================
# Docker 环境配置
# 数据库/Redis/MinIO 指向 docker-compose 的服务名
# 由 docker-compose 中的 SPRING_PROFILES_ACTIVE=docker 激活
# ============================================================

# ─── 数据库 ───
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/book_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}

  # ─── Redis ───
  data:
    redis:
      host: redis
      port: 6379
      database: 1
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1

  # ─── Jackson ───
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ─── MinIO 对象存储 ───
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: book-covers

# ─── Sa-Token（双 token 认证）───
sa-token:
  token-name: Authorization
  timeout: 1800
  refresh-token-timeout: 604800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-print: false

# ─── 日志（生产环境减少日志输出） ───
logging:
  level:
    com.bookmgt: INFO
    com.baomidou.mybatisplus: INFO
