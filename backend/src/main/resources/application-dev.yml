# ============================================================
# 开发环境配置
# 你需要根据本地环境修改以下配置项
# ============================================================

# ─── 数据库 ───
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/book_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # ⚠️ 通过环境变量 SPRING_DATASOURCE_PASSWORD 设置
    password: ${SPRING_DATASOURCE_PASSWORD}

  # ─── Redis ───
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1

# ─── MinIO 对象存储 ───
minio:
  endpoint: http://localhost:9000
  # ⚠️ 通过环境变量 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 设置
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: book-covers

# ─── Sa-Token（双 token 认证）───
sa-token:
  token-name: Authorization
  timeout: 1800                 # access token 有效期（秒）30 分钟
  refresh-token-timeout: 604800  # refresh token 有效期（秒）7 天
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-print: false

# ─── 日志 ───
logging:
  level:
    com.bookmgt: DEBUG
    com.baomidou.mybatisplus: DEBUG
